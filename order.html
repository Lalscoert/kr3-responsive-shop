<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Форма заявки учебного интернет-магазина.">
  <title>Заявка — Учебный интернет-магазин</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">ShopProject</a>

      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item">
            <a class="site-nav__link" href="index.html">Главная</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="catalog.html">Каталог</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link site-nav__link--active" href="order.html">Заявка</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="contacts.html">Контакты</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="index.html#popular">Популярные товары</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <span class="breadcrumbs__current">Заявка</span>
    </nav>

    <section class="section">
      <h1>Оформление заявки</h1>

      <form class="order-form" action="#" method="post">
        <div class="order-form__field">
          <label class="order-form__label" for="order-name">Имя</label>
          <input class="order-form__input" id="order-name" name="name" type="text" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-email">E-mail</label>
          <input class="order-form__input" id="order-email" name="email" type="email" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-phone">Телефон</label>
          <input class="order-form__input" id="order-phone" name="phone" type="tel" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-product">Товар</label>
          <select class="order-form__select" id="order-product" name="product" required>
            <option value="">Выберите товар</option>
            <option value="Товар 1">Товар 1 — 1000 руб.</option>
            <option value="Товар 2">Товар 2 — 1500 руб.</option>
            <option value="Товар 3">Товар 3 — 2000 руб.</option>
          </select>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-comment">Комментарий</label>
          <textarea class="order-form__textarea" id="order-comment" name="comment" rows="4"></textarea>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-agreement">
            <input class="order-form__input" id="order-agreement" name="agreement" type="checkbox" required>
            Я согласен на обработку данных
          </label>
        </div>

        <div class="order-form__actions">
          <button class="button button--primary" type="submit">Отправить заявку</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer" id="contacts">
    <div class="site-footer__inner">
      <p>&copy; 2026 Учебный проект. Все права защищены.</p>
      <p>Дисциплина: Фронтенд и бэкенд разработка</p>
    </div>
  </footer>
</body>
</html>
